; PHP ships with upload_max_filesize=2M by default, which is enough for
; question images but silently rejects audio clips (a short recording
; easily exceeds 2MB). PHP has no true "unlimited" value for these
; directives (0 means disabled, not unlimited), so raise both to a
; generously high ceiling instead.
upload_max_filesize = 512M
post_max_size = 512M

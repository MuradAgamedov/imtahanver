services:
  # Database Service (MySQL 8.0)
  db:
    image: mysql:8.0
    container_name: imtahanver_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: imtahanver
      MYSQL_USER: imtahanver_user
      MYSQL_PASSWORD: imtahanver_password
      MYSQL_ROOT_PASSWORD: imtahanver_root_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -pimtahanver_root_password"]
      interval: 5s
      timeout: 5s
      retries: 5

  # phpMyAdmin Web Client
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: imtahanver_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: imtahanver_root_password
    ports:
      - "8081:80"
    depends_on:
      - db

  # Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: imtahanver_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Laravel Backend (FrankenPHP)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imtahanver_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      SERVER_NAME: ":80"
      APP_URL: https://api.imtahanver.online
      APP_DEBUG: "true"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: imtahanver
      DB_USERNAME: imtahanver_user
      DB_PASSWORD: imtahanver_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.hostinger.com
      MAIL_PORT: 587
      MAIL_USERNAME: noreply@avicom.az
      MAIL_PASSWORD: "~9nj91MnW"
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: noreply@avicom.az
      MAIL_FROM_NAME: "Imtahanver"
      MAIL_TO_ADDRESS: noreply@avicom.az
    ports:
      - "8000:80"
    volumes:
      - ./backend:/app
      - /app/vendor
      - backend_storage:/app/storage

  # Laravel Queue Worker (Horizon)
  horizon:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: imtahanver_horizon
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: https://api.imtahanver.online
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: imtahanver
      DB_USERNAME: imtahanver_user
      DB_PASSWORD: imtahanver_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      SESSION_DRIVER: redis
      QUEUE_CONNECTION: redis
      MAIL_MAILER: smtp
      MAIL_HOST: smtp.hostinger.com
      MAIL_PORT: 587
      MAIL_USERNAME: noreply@avicom.az
      MAIL_PASSWORD: "~9nj91MnW"
      MAIL_ENCRYPTION: tls
      MAIL_FROM_ADDRESS: noreply@avicom.az
      MAIL_FROM_NAME: "Imtahanver"
      MAIL_TO_ADDRESS: noreply@avicom.az
    volumes:
      - ./backend:/app
      - /app/vendor
      - backend_storage:/app/storage
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -q 'running'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Frontend Web App (React Router v7 SSR)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: imtahanver_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      API_URL: http://backend:80
      STORAGE_URL: https://api.imtahanver.online

  # Admin Dashboard App (React Router v7 SSR)
  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: imtahanver_admin
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      API_URL: http://backend:80
      STORAGE_URL: https://api.imtahanver.online

  # Main Landing Page (Nginx Static)
  main:
    build:
      context: ./main
      dockerfile: Dockerfile
    container_name: imtahanver_main
    restart: unless-stopped
    ports:
      - "8085:80"

volumes:
  mysql_data:
  redis_data:
  backend_storage:
